<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">French IT services firms and AI: hiring is changing</title><desc id="d">62% say AI weighs on their hiring, 47% require AI skills, 22% see junior hiring falling sharply, 9% rising.</desc>
<rect width="600" height="340" rx="12" fill="#1c1b1b"/>
<text x="24" y="38" fill="#e5e2e1" font-size="19" font-weight="600">French IT services firms and AI: hiring is changing</text>
<text x="24" y="62" fill="#a8a29a" font-size="13.5">Share of IT services and ICT firms surveyed, France, 2026</text>
<line x1="215.0" y1="84" x2="215.0" y2="268" stroke="#353534" stroke-width="1"/>
<text x="215.0" y="286" fill="#a8a29a" font-size="12" text-anchor="middle">0%</text>
<line x1="307.3" y1="84" x2="307.3" y2="268" stroke="#353534" stroke-width="1"/>
<text x="307.3" y="286" fill="#a8a29a" font-size="12" text-anchor="middle">20%</text>
<line x1="399.6" y1="84" x2="399.6" y2="268" stroke="#353534" stroke-width="1"/>
<text x="399.6" y="286" fill="#a8a29a" font-size="12" text-anchor="middle">40%</text>
<line x1="491.9" y1="84" x2="491.9" y2="268" stroke="#353534" stroke-width="1"/>
<text x="491.9" y="286" fill="#a8a29a" font-size="12" text-anchor="middle">60%</text>
<text x="201" y="103" fill="#e5e2e1" font-size="14" text-anchor="end">AI weighs on hiring</text>
<path d="M215.0,92 H497.0857142857143 Q501.0857142857143,92 501.0857142857143,96 V110 Q501.0857142857143,114 497.0857142857143,114 H215.0 Z" fill="#b8890a"><title>AI weighs on hiring : 62%</title></path>
<text x="509.1" y="108" fill="#e5e2e1" font-size="13.5" font-weight="600" text-anchor="start">62%</text>
<text x="201" y="149" fill="#e5e2e1" font-size="14" text-anchor="end">AI skills required</text>
<text x="201" y="165" fill="#a8a29a" font-size="11.5" text-anchor="end">from the start of a career</text>
<path d="M215.0,138 H427.87142857142857 Q431.87142857142857,138 431.87142857142857,142 V156 Q431.87142857142857,160 427.87142857142857,160 H215.0 Z" fill="#b8890a"><title>AI skills required : 47%</title></path>
