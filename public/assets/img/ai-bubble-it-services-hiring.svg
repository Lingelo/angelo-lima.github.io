<text x="201" y="211" fill="#a8a29a" font-size="11.5" text-anchor="end">falling sharply</text>
<path d="M215.0,184 H312.51428571428573 Q316.51428571428573,184 316.51428571428573,188 V202 Q316.51428571428573,206 312.51428571428573,206 H215.0 Z" fill="#b8890a"><title>Junior hiring : 22%</title></path>
<text x="324.5" y="200" fill="#e5e2e1" font-size="13.5" font-weight="600" text-anchor="start">22%</text>
