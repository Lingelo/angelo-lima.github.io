<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384" viewBox="0 0 760 384" role="img" aria-labelledby="t d">
<title id="t">L’eau et le CO₂ des data centers devraient doubler d’ici 2030</title>
<desc id="d">Ensemble des data centers dans le monde · 2025 mesuré, 2030 projeté. Eau consommée: 4500 (2025) → 9300 (2030); Émissions de CO₂: 189 (2025) → 399 (2030). Source : Université des Nations unies, rapport de juin 2026</desc>
<defs><style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;fill:#f5f5f5}
.t{font-size:19px;font-weight:700;fill:#f5f5f5}.s{fill:#b5b5b5}.g{fill:#edb926}
</style></defs>
<rect width="760" height="384" rx="14" fill="#111111"/>
<text x="20.0" y="32.0" class="t">L’eau et le CO₂ des data centers devraient doubler d’ici 2030</text>
<text x="20.0" y="56.0" class="s">Ensemble des data centers dans le monde · 2025 mesuré, 2030 projeté</text>
<text x="40.0" y="96.0" font-size="15" font-weight="600">Eau consommée</text>
<text x="40.0" y="114.0" class="s">en milliards de litres</text>
<line x1="40" x2="330" y1="320" y2="320" stroke="#b5b5b5"/>
<rect x="60" y="242.6" width="100" height="77.4" rx="2" fill="#edb926" fill-opacity="0.4"/>
<text x="110.0" y="234.6" text-anchor="middle">4 500</text>
<text x="110.0" y="338.0" class="s" text-anchor="middle">2025</text>
<rect x="210" y="160.0" width="100" height="160.0" rx="2" fill="#edb926" fill-opacity="1"/>
<text x="260.0" y="152.0" text-anchor="middle">9 300</text>
<text x="260.0" y="338.0" class="s" text-anchor="middle">2030 (projection)</text>
<text x="185.0" y="208.6" class="g" text-anchor="middle" font-size="15" font-weight="700">×2,1</text>
<text x="410.0" y="96.0" font-size="15" font-weight="600">Émissions de CO₂</text>
<text x="410.0" y="114.0" class="s">en millions de tonnes</text>
<line x1="410" x2="700" y1="320" y2="320" stroke="#b5b5b5"/>
<rect x="430" y="244.2" width="100" height="75.8" rx="2" fill="#edb926" fill-opacity="0.4"/>
<text x="480.0" y="236.2" text-anchor="middle">189</text>
<text x="480.0" y="338.0" class="s" text-anchor="middle">2025</text>
<rect x="580" y="160.0" width="100" height="160.0" rx="2" fill="#edb926" fill-opacity="1"/>
<text x="630.0" y="152.0" text-anchor="middle">399</text>
<text x="630.0" y="338.0" class="s" text-anchor="middle">2030 (projection)</text>
<text x="555.0" y="210.2" class="g" text-anchor="middle" font-size="15" font-weight="700">×2,1</text>
<text x="20.0" y="368.0" class="s" font-size="11">Source : Université des Nations unies, rapport de juin 2026</text>
</svg>
