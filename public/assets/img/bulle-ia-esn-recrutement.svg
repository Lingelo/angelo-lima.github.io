<title id="t">Les ESN face à l'IA : ce qui change dans le recrutement</title><desc id="d">62 % des ESN disent que l'IA pèse sur leurs recrutements, 47 % exigent une maîtrise de l'IA, 22 % voient le recrutement des juniors en forte baisse, 9 % en hausse.</desc>
<rect width="600" height="340" rx="12" fill="#1c1b1b"/>
<text x="24" y="38" fill="#e5e2e1" font-size="19" font-weight="600">Les ESN face à l'IA : ce qui change dans le recrutement</text>
<text x="24" y="62" fill="#a8a29a" font-size="13.5">Part des ESN et ICT interrogées, France, 2026</text>
