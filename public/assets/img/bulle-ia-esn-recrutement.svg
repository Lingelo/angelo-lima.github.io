<text x="307.3" y="286" fill="#a8a29a" font-size="12" text-anchor="middle">20 %</text>
<line x1="399.6" y1="84" x2="399.6" y2="268" stroke="#353534" stroke-width="1"/>
<text x="399.6" y="286" fill="#a8a29a" font-size="12" text-anchor="middle">40 %</text>
<line x1="491.9" y1="84" x2="491.9" y2="268" stroke="#353534" stroke-width="1"/>
<text x="491.9" y="286" fill="#a8a29a" font-size="12" text-anchor="middle">60 %</text>
<text x="201" y="103" fill="#e5e2e1" font-size="14" text-anchor="end">L'IA pèse sur l'embauche</text>
<path d="M215.0,92 H497.0857142857143 Q501.0857142857143,92 501.0857142857143,96 V110 Q501.0857142857143,114 497.0857142857143,114 H215.0 Z" fill="#b8890a"><title>L'IA pèse sur l'embauche : 62 %</title></path>
<text x="509.1" y="108" fill="#e5e2e1" font-size="13.5" font-weight="600" text-anchor="start">62 %</text>
<text x="201" y="149" fill="#e5e2e1" font-size="14" text-anchor="end">Maîtrise de l'IA exigée</text>
<text x="201" y="165" fill="#a8a29a" font-size="11.5" text-anchor="end">dès le début de carrière</text>
<path d="M215.0,138 H427.87142857142857 Q431.87142857142857,138 431.87142857142857,142 V156 Q431.87142857142857,160 427.87142857142857,160 H215.0 Z" fill="#b8890a"><title>Maîtrise de l'IA exigée : 47 %</title></path>
<text x="439.9" y="154" fill="#e5e2e1" font-size="13.5" font-weight="600" text-anchor="start">47 %</text>
<text x="201" y="195" fill="#e5e2e1" font-size="14" text-anchor="end">Recrutement des juniors</text>
<text x="201" y="211" fill="#a8a29a" font-size="11.5" text-anchor="end">en forte baisse</text>
<path d="M215.0,184 H312.51428571428573 Q316.51428571428573,184 316.51428571428573,188 V202 Q316.51428571428573,206 312.51428571428573,206 H215.0 Z" fill="#b8890a"><title>Recrutement des juniors : 22 %</title></path>
<text x="324.5" y="200" fill="#e5e2e1" font-size="13.5" font-weight="600" text-anchor="start">22 %</text>
<text x="201" y="241" fill="#e5e2e1" font-size="14" text-anchor="end">Recrutement des juniors</text>
<text x="201" y="257" fill="#a8a29a" font-size="11.5" text-anchor="end">en hausse</text>
