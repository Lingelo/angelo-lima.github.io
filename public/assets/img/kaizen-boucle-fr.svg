<title id="t">La boucle Kaizen</title>
<desc id="d">La constitution encadre tout. Construire : brainstorm, plan, doc-review, work, review, ship. Exploiter : vous mergez, deploy, monitor, incident, rollback, post-mortem. Learnings, ADR et post-mortems vont dans la mémoire du projet, relue au cycle suivant.</desc>
