<svg xmlns="http://www.w3.org/2000/svg" width="760" height="304" viewBox="0 0 760 304" role="img" aria-labelledby="t d">
<title id="t">Manufacturing dominates several impacts of a GPU</title>
<desc id="d">Share of manufacturing in the full life-cycle impact of an Nvidia A100 GPU. Human toxicity (cancer): 94 %; Freshwater eutrophication: 81 %; Mineral and metal depletion: 71 %. Source: “More than Carbon” life-cycle assessment, Nvidia A100 GPU (arXiv, 2025)</desc>
<defs><style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;fill:#f5f5f5}
.t{font-size:19px;font-weight:700;fill:#f5f5f5}.s{fill:#b5b5b5}.g{fill:#edb926}
</style></defs>
<rect width="760" height="304" rx="14" fill="#111111"/>
<text x="20.0" y="32.0" class="t">Manufacturing dominates several impacts of a GPU</text>
<text x="20.0" y="56.0" class="s">Share of manufacturing in the full life-cycle impact of an Nvidia A100 GPU</text>
<text x="20.0" y="80.0" class="g">Gold: chip manufacturing</text>
<text x="250.0" y="80.0" class="s">Grey: other phases (use, transport, end of life)</text>
<text x="238.0" y="131.0" text-anchor="end">Human toxicity (cancer)</text>
<rect x="250" y="116" width="441.8" height="22" fill="#edb926"/>
<rect x="691.8" y="116" width="28.2" height="22" fill="#5a5a5a"/>
<text x="250.0" y="110.0" class="g" font-weight="700">94%</text>
<text x="238.0" y="187.0" text-anchor="end">Freshwater eutrophication</text>
<rect x="250" y="172" width="380.7" height="22" fill="#edb926"/>
<rect x="630.7" y="172" width="89.3" height="22" fill="#5a5a5a"/>
<text x="250.0" y="166.0" class="g" font-weight="700">81%</text>
<text x="238.0" y="243.0" text-anchor="end">Mineral and metal depletion</text>
<rect x="250" y="228" width="333.7" height="22" fill="#edb926"/>
<rect x="583.7" y="228" width="136.3" height="22" fill="#5a5a5a"/>
<text x="250.0" y="222.0" class="g" font-weight="700">71%</text>
<text x="20.0" y="288.0" class="s" font-size="11">Source: “More than Carbon” life-cycle assessment, Nvidia A100 GPU (arXiv, 2025)</text>
</svg>
